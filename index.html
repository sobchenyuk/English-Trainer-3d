<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Trainer 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f; --bg2:#0f1220; --card:#151a2e; --card2:#1c2340; --line:#2a3358;
  --tx:#eef1ff; --mut:#8b93b8; --a1:#7c5cff; --a2:#22d3ee; --ok:#34d399; --mid:#fbbf24; --bad:#fb7185;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- 3D background ---------- */
.scene-bg{position:fixed;inset:0;z-index:0;overflow:hidden;perspective:600px;pointer-events:none}
.grid{position:absolute;left:-50%;right:-50%;bottom:-30%;height:80%;
  background-image:linear-gradient(rgba(124,92,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.25) 1px,transparent 1px);
  background-size:48px 48px;transform:rotateX(72deg);transform-origin:bottom;animation:gridmove 6s linear infinite;
  mask-image:linear-gradient(to top,#000 10%,transparent 85%);-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%)}
@keyframes gridmove{to{background-position:0 48px,0 0}}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;animation:float 14s ease-in-out infinite}
.orb.o1{width:320px;height:320px;background:var(--a1);top:-80px;left:-80px}
.orb.o2{width:260px;height:260px;background:var(--a2);top:30%;right:-100px;animation-delay:-5s}
@keyframes float{50%{transform:translate(40px,60px) scale(1.15)}}

.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px 16px 96px;min-height:100%}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo span{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{margin-left:auto;display:flex;gap:8px}
.chip{background:rgba(21,26,46,.8);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;backdrop-filter:blur(8px)}

/* ---------- goal strip ---------- */
.goal{display:flex;align-items:center;gap:14px;background:rgba(21,26,46,.75);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:16px;backdrop-filter:blur(10px)}
.ringwrap{perspective:400px}
.ring3d{width:62px;height:62px;transform:rotateX(18deg) rotateY(-14deg);transform-style:preserve-3d;filter:drop-shadow(0 8px 14px rgba(124,92,255,.45))}
.goal .t{font-size:13px;color:var(--mut)}
.goal .v{font-size:22px;font-weight:800}
.goal .v small{font-size:13px;color:var(--mut);font-weight:600}
.goal .sub{font-size:12px;color:var(--mut);margin-top:2px}

/* ---------- views ---------- */
.view{display:none;animation:in .35s ease}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.h{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:4px 2px 10px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.h span:last-child{color:var(--a2);text-transform:none;letter-spacing:0}

/* ---------- flashcard ---------- */
.stage{perspective:1100px;margin-bottom:14px}
.card3d{position:relative;height:380px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.card3d.flip .inner{transform:rotateY(180deg)}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;
  background:linear-gradient(155deg,var(--card2),var(--card) 60%);border:1px solid var(--line);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);display:flex;flex-direction:column;overflow:hidden}
.face::before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(135deg,rgba(124,92,255,.8),transparent 40%,rgba(34,211,238,.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.face .shine{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.12),transparent 50%);pointer-events:none}
.back{transform:rotateY(180deg);overflow-y:auto}
/* the hidden side must not catch taps (Safari keeps routing clicks to it) */
.card3d:not(.flip) .back{pointer-events:none}
.card3d.flip .front{pointer-events:none}
.face .spk{position:relative;z-index:2}
.tag{align-self:flex-start;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(124,92,255,.18);color:#c4b5fd;letter-spacing:.04em}
.stagebadge{position:absolute;top:22px;right:22px;display:flex;gap:3px}
.stagebadge i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.stagebadge i.f{background:var(--ok)}
.front .ru-front{font-size:20px;font-weight:600;color:var(--tx);opacity:.85;margin-top:10px}
.front .word{font-size:clamp(34px,10vw,46px);font-weight:800;letter-spacing:-.02em;margin-top:auto;transform:translateZ(40px);text-shadow:0 10px 30px rgba(124,92,255,.5)}
.ipa{font-family:"JetBrains Mono",monospace;color:var(--a2);font-size:16px;margin-top:6px}
.hint{margin-top:auto;font-size:13px;color:var(--mut);display:flex;align-items:center;justify-content:space-between}
.spk{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--a1),#5b3fd9);display:grid;place-items:center;box-shadow:0 8px 20px -6px var(--a1);flex:none}
.spk.sm{width:36px;height:36px;border-radius:11px}
.spk svg{width:20px;height:20px}
.spk.playing{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(124,92,255,.25)}}
.back .ru{font-size:28px;font-weight:800;margin-top:12px}
.back .def{color:var(--mut);font-size:14px;margin-top:6px;font-style:italic}
.blk{margin-top:12px;background:rgba(7,8,15,.45);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.blk .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.blk .p{font-size:17px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}
.blk .pr{font-size:13px;color:var(--mut);margin-top:3px}

.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;transition:opacity .3s}
.grades.off{opacity:.25;pointer-events:none}
.g{border-radius:16px;padding:14px 6px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--card);transform:translateZ(0);transition:transform .15s,box-shadow .15s;box-shadow:0 6px 0 #0b0e1c}
.g:active{transform:translateY(4px);box-shadow:0 2px 0 #0b0e1c}
.g small{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-top:2px}
.g.b{color:var(--bad)} .g.m{color:var(--mid)} .g.k{color:var(--ok)}

/* ---------- quiz ---------- */
.qcard{background:linear-gradient(155deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:12px;text-align:center;
  transform:perspective(900px) rotateX(6deg);box-shadow:0 24px 40px -18px #000}
.qcard .word{font-size:34px;font-weight:800}
.qcard .ipa{margin-top:4px}
.qcard .bigspk{width:72px;height:72px;border-radius:22px;margin:4px auto 6px}
.qcard .acts .bigspk{margin:0}
.qcard .bigspk svg{width:32px;height:32px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:15px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px;box-shadow:0 5px 0 #0b0e1c;transition:transform .12s}
.opt:active{transform:translateY(3px)}
.opt.right{background:rgba(52,211,153,.15);border-color:var(--ok)}
.opt.wrong{background:rgba(251,113,133,.15);border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.reveal{margin-top:12px;font-size:14px;color:var(--mut);text-align:center;min-height:20px}
.next{width:100%;margin-top:12px;padding:15px;border-radius:16px;background:linear-gradient(90deg,var(--a1),var(--a2));font-weight:800;color:#0a0b14;display:none}
.next.on{display:block}

/* ---------- speak ---------- */
.mic{width:96px;height:96px;border-radius:50%;margin:8px auto;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ff8fa3,#e11d48);box-shadow:0 14px 30px -8px #e11d48,inset 0 -6px 12px rgba(0,0,0,.3)}
.mic svg{width:38px;height:38px}
.mic.on{animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 16px rgba(225,29,72,.18),0 14px 30px -8px #e11d48}}
.heard{min-height:48px;font-size:17px;text-align:center;margin:8px 0;color:var(--tx)}
.heard .w-ok{color:var(--ok)} .heard .w-close{color:var(--mid)} .heard .w-no{color:var(--bad);text-decoration:line-through} .heard .w-skip{color:var(--mut);font-style:italic}
.score{font-size:40px;font-weight:800;text-align:center}
.note{font-size:13px;color:var(--mut);text-align:center;line-height:1.5}
.self{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.self.on{display:grid}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tile{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:14px;
  transform:perspective(700px) rotateX(8deg);transform-origin:bottom;box-shadow:0 18px 30px -16px #000}
.tile .n{font-size:28px;font-weight:800}
.tile .l{font-size:12px;color:var(--mut)}
.panel{background:rgba(21,26,46,.8);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px;backdrop-filter:blur(8px)}
.road{position:relative;height:14px;border-radius:999px;background:#0b0e1c;border:1px solid var(--line);margin:30px 0 26px}
.road .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:0 0 18px var(--a1);transition:width 1s}
.road .mk{position:absolute;top:-24px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--mut);text-align:center}
.road .mk::after{content:"";display:block;width:2px;height:30px;background:var(--line);margin:4px auto 0}
.road .mk.got{color:var(--a2)}
.road .mk b{display:block;font-size:10px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;perspective:500px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.prism{width:100%;max-width:34px;position:relative;transform-style:preserve-3d;transform:rotateX(-14deg) rotateY(-24deg);transition:height .8s}
.prism .fr{position:absolute;inset:0;background:linear-gradient(to top,#5b3fd9,var(--a1));border-radius:3px}
.prism .sd{position:absolute;top:0;bottom:0;right:-10px;width:10px;background:#3f2aa8;transform:skewY(-40deg);transform-origin:left}
.prism .tp{position:absolute;left:0;right:0;top:-8px;height:8px;background:#a78bfa;transform:skewX(-50deg);transform-origin:bottom}
.prism.today .fr{background:linear-gradient(to top,#0e9fb6,var(--a2))} .prism.today .sd{background:#0b7c8f} .prism.today .tp{background:#a5f3fc}
.bar .d{font-size:11px;color:var(--mut)}
.bar .c{font-size:11px;font-weight:700}
.topic{margin-bottom:12px}
.topic .r{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;font-weight:600}
.topic .r span{color:var(--mut);font-weight:600}
.tbar{height:10px;border-radius:999px;background:#0b0e1c;overflow:hidden;display:flex}
.tbar i{display:block;height:100%}
.legend{display:flex;gap:12px;font-size:11px;color:var(--mut);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.reset{font-size:12px;color:var(--mut);text-decoration:underline;margin:4px auto 0;display:block}

.done{text-align:center;padding:40px 16px}
.done .big{font-size:64px;animation:spin3d 3s ease-in-out infinite;display:inline-block}
@keyframes spin3d{50%{transform:rotateY(180deg) scale(1.1)}}
.done h2{margin:10px 0 6px}
.cta{display:inline-block;margin-top:16px;padding:13px 20px;border-radius:14px;background:linear-gradient(90deg,var(--a1),var(--a2));color:#0a0b14;font-weight:800}

/* ---------- nav ---------- */
.nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;gap:4px;
  background:rgba(15,18,32,.85);border:1px solid var(--line);border-radius:22px;padding:6px;backdrop-filter:blur(14px);box-shadow:0 20px 40px -10px #000;width:min(500px,calc(100% - 24px))}
.nav button{flex:1;padding:8px 2px;border-radius:16px;font-size:11px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s}
.nav button svg{width:20px;height:20px}
.nav button.on{color:var(--tx);background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(34,211,238,.2))}
.search{width:100%;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:15px;outline:none;resize:vertical}
.search:focus{border-color:var(--a1)}
.sel{width:100%;margin-top:8px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:14px}
.lab{display:block;font-size:12px;color:var(--mut);margin-top:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:16px;background:rgba(21,26,46,.75);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;transition:transform .2s}
.row:active{transform:scale(.99)}
.rw{flex:1;min-width:0}
.ru2{color:var(--tx);opacity:.85;font-size:14px;margin-top:2px}
.row .ex{display:none;font-size:13px;margin-top:6px;color:var(--tx)}
.row .ex span{color:var(--mut)}
.row.open .ex{display:block}
.rs{display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.nav button{font-size:10px}
.acts{display:flex;gap:8px;flex:none}
.mic2{background:radial-gradient(circle at 35% 30%,#ff8fa3,#e11d48);box-shadow:0 8px 20px -6px #e11d48}
.mic2.rec{animation:pulse2 1.2s infinite}
.cres{font-size:14px;margin-top:6px;line-height:1.5}
.cres:empty{display:none}
.cres .w-ok{color:var(--ok)} .cres .w-close{color:var(--mid)} .cres .w-no{color:var(--bad);text-decoration:line-through} .cres .w-skip{color:var(--mut);font-style:italic}
.seg{display:inline-flex;margin-top:10px;padding:4px;border-radius:999px;background:#0b0e1c;border:1px solid var(--line);gap:4px}
.seg button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mut);transition:.2s}
.seg button.on{background:linear-gradient(135deg,var(--a1),#5b3fd9);color:#fff;box-shadow:0 6px 14px -6px var(--a1)}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-80px);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:9;transition:transform .35s}
.toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="scene-bg"><div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div></div>

<div class="app">
  <div class="top">
    <div class="logo">Speak<span>Up</span> 3D</div>
    <div class="chips">
      <div class="chip" id="streakChip">🔥 0</div>
      <div class="chip" id="levelChip">A1</div>
    </div>
  </div>

  <div class="goal">
    <div class="ringwrap"><svg class="ring3d" viewBox="0 0 64 64">
      <defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
      <circle cx="32" cy="32" r="26" fill="none" stroke="#1c2340" stroke-width="8"/>
      <circle id="ring" cx="32" cy="32" r="26" fill="none" stroke="url(#rg)" stroke-width="8" stroke-linecap="round" transform="rotate(-90 32 32)" stroke-dasharray="163.4" stroke-dashoffset="163.4" style="transition:stroke-dashoffset .8s"/>
      <text id="ringPct" x="32" y="37" text-anchor="middle" fill="#eef1ff" font-size="14" font-weight="800" font-family="Manrope">0%</text>
    </svg></div>
    <div>
      <div class="t">Цель на сегодня</div>
      <div class="v"><span id="todayCnt">0</span> <small>/ 100 повторений</small></div>
      <div class="sub" id="todaySub">Новых: 0 / 25 · к повтору: 0</div>
    </div>
  </div>

  <!-- LEARN -->
  <section class="view on" id="v-learn">
    <div class="h"><span id="learnTitle">Карточки</span><span id="learnLeft"></span></div>
    <div id="learnBox"></div>
  </section>

  <!-- QUIZ -->
  <section class="view" id="v-quiz">
    <div class="h"><span>Тест: выбери перевод</span><span id="quizScore"></span></div>
    <div id="quizBox"></div>
  </section>

  <!-- LISTEN -->
  <section class="view" id="v-listen">
    <div class="h"><span>Аудирование</span><span id="listenScore"></span></div>
    <div id="listenBox"></div>
  </section>

  <!-- SPEAK -->
  <section class="view" id="v-speak">
    <div class="h"><span>Говорение</span><span id="speakScore"></span></div>
    <div id="speakBox"></div>
  </section>

  <!-- DICT -->
  <section class="view" id="v-dict">
    <div id="dictBox"></div>
  </section>

  <!-- STATS -->
  <section class="view" id="v-stats">
    <div id="statsBox"></div>
  </section>
</div>

<nav class="nav" id="nav">
  <button data-v="learn" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="14" height="16" rx="3"/><path d="M7 3h11a3 3 0 0 1 3 3v12"/></svg>Учить</button>
  <button data-v="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>Тест</button>
  <button data-v="listen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="5" height="7" rx="2"/><rect x="16" y="14" width="5" height="7" rx="2"/></svg>Слушать</button>
  <button data-v="speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Говорить</button>
  <button data-v="dict"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 20a4 4 0 0 1 0-8h12"/></svg>Словарь</button>
  <button data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Прогресс</button>
</nav>
<div class="toast" id="toast"></div>

<script src="words.js"></script>
<script>
/* ===== DATA (words.js) ===== */
const W=window.WORDS||[], TOPICS=window.TOPICS||[];
const KEY=W.map(w=>w[0]+"|"+w[2]);
const INT=[0,1,3,7,14,30];
const GOAL=100, TARGET=3000;
const LEVELS=[[0,"A0"],[500,"A1"],[1000,"A2"],[2000,"B1"],[3000,"B2"]];

/* ===== STATE ===== */
const dayNum=(t=Date.now())=>Math.floor((t-new Date(t).getTimezoneOffset()*60000)/86400000);
const DEF_SET={n:25,topic:-1,rate:0.95};
let S={cards:{},days:{},streak:0,lastDay:null,ts:0,set:Object.assign({},DEF_SET)};
const LS="speakup3d_v2";
try{const raw=localStorage.getItem(LS); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
S.set=Object.assign({},DEF_SET,S.set||{});
let dbRef=null, saving=false, pendingSave=false, saveTimer=null;

function save(){
  S.ts=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}

    expand(tok).split(" ").filter(Boolean).forEach(x=>marks.push(proper?{x,st:"skip"}:{x,st:["no","close","ok"][nearness(x,heardSet)]}));
  });
  const counted=marks.filter(m=>m.st!=="skip");
  const sc=counted.length?Math.round(counted.filter(m=>m.st!=="no").length/counted.length*100):100;
  return {marks,sc};
}
function renderSpeak(){
  if(sp.i===null){ const p=pool(); sp.i=p[Math.random()*p.length|0]; sp.heard=""; }
  const w=W[sp.i];
  const hasMic=!!MICE;
  $("#speakBox").innerHTML=`
    <div class="qcard">
      <div class="note">Скажите по-английски:</div>
      <div style="font-size:22px;font-weight:800;margin:8px 0">${esc(w[6])}</div>
      <div class="note">подсказка: <b style="color:var(--a2)">${esc(w[0])}</b> ${esc(w[1])}</div>
    </div>
    ${hasMic?`<button class="mic" id="micBtn">${MIC}</button><div class="note" id="micNote">Нажмите и скажите фразу</div>`
            :`<div class="note" style="margin:8px 0">Скажите фразу вслух, затем откройте ответ и оцените себя.<br><span style="opacity:.7">Проверка микрофоном работает в Chrome и Edge.</span></div>`}
    <div class="heard" id="heard"></div>
    <div id="spRes"></div>
    <div class="blk" id="ans" style="display:none"><div class="l">Правильно</div><div class="p"><span>${esc(w[5])}</span><button class="spk sm" data-say="${esc(w[5])}">${SPK}</button></div></div>
    <button class="next ${hasMic?"":"on"}" id="showAns" style="background:var(--card2);color:var(--tx);border:1px solid var(--line)">Показать ответ</button>
    <div class="self" id="selfBox"><button class="g b" data-sg="0">Не смог</button><button class="g k" data-sg="1">Сказал верно</button></div>
    <button class="next" id="snext">Следующая фраза →</button>`;
  const box=$("#speakBox");
  box.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",()=>say(b.dataset.say,b)));
  $("#snext").addEventListener("click",()=>{sp.i=null;spH={};renderSpeak();});
  $("#showAns").addEventListener("click",()=>{ $("#ans").style.display="block"; $("#showAns").classList.remove("on"); $("#selfBox").classList.add("on"); say(w[5]); });
  box.querySelectorAll("[data-sg]").forEach(b=>b.addEventListener("click",()=>{ const ok=b.dataset.sg==="1"; finishSpeak(ok, ok?"✅ Отлично!":"Послушайте и повторите вслух 3 раза"); }));
  if(!hasMic){ spH={}; return; }
  const btn=$("#micBtn"); let text="", listening=false, done=false, extra=[];
  spH={
    state:({state,reason})=>{
      listening=state==="listening"; btn.classList.toggle("on",listening);
      $("#micNote").textContent=listening?"Слушаю… нажмите ещё раз, чтобы закончить":"Нажмите и скажите фразу";
      if(!listening&&text&&!done&&reason!=="hidden") evaluate();
      if(!listening&&!text&&reason&&reason!=="stopped"&&reason!=="viewer_stopped") $("#micNote").textContent="Ничего не услышал — попробуйте ещё раз";
    },
    partial:({text:t})=>{ $("#heard").textContent=(text+" "+t).trim(); },
    final:({text:t,alts})=>{ text=(text+" "+t).trim(); if(alts) extra.push(...alts); $("#heard").textContent=text; }
  };
  btn.addEventListener("click",()=>{
    if(listening){ MICE.stop().catch(()=>{}); return; }
    text=""; extra=[]; done=false; $("#heard").textContent=""; $("#spRes").innerHTML="";
    MICE.start().catch(e=>{ const code=e&&e.code; if(code==="not_granted"){ MICE=null; toast("Микрофон недоступен — оценивайте себя сами"); renderSpeak(); } else toast("Не удалось включить микрофон"); });
  });
  function evaluate(){
    done=true;
    const {marks,sc}=compare(w[5],text,extra);
    $("#heard").innerHTML=marks.map(m=>`<span class="w-${m.st}">${esc(m.x)}</span>`).join(" ");
    finishSpeak(sc>=80, `<div class="score" style="color:${sc>=80?"var(--ok)":sc>=50?"var(--mid)":"var(--bad)"}">${sc}%</div><div class="note">${sc>=80?"Отлично, вас поняли!":"Зачёркнутые слова не распознались — послушайте и повторите"}${marks.some(m=>m.st==="close")?"<br>Жёлтые — засчитаны примерно.":""}${marks.some(m=>m.st==="skip")?"<br>Серые имена и названия не проверяются.":""}</div>`);
  }
}
let spStat={ok:0,all:0};
function finishSpeak(ok,html){
  const c=card(sp.i); if(!c.seen){c.seen=1;dayRec().n++;}
  if(ok) c.ok++; else {c.bad++; c.due=dayNum();}
  spStat.all++; if(ok) spStat.ok++;
  logAnswer(ok); save(); refreshHeader();
  $("#spRes").innerHTML=typeof html==="string"&&html.startsWith("<")?html:`<div class="note" style="font-size:16px;color:var(--tx)">${html}</div>`;
  $("#ans").style.display="block"; $("#showAns").classList.remove("on"); $("#selfBox").classList.remove("on"); $("#snext").classList.add("on");
  $("#speakScore").textContent=spStat.ok+" / "+spStat.all;
}

/* ===== STATS ===== */
function renderStats(){
  const seen=seenIdx(), learned=learnedCount(), learning=seen.length-learned;
  let a=0,c=0; Object.values(S.days).forEach(r=>{a+=r.a;c+=r.c;});
  const acc=a?Math.round(c/a*100):0;
  const d=dayNum(); const week=[]; for(let k=6;k>=0;k--){ const r=S.days[d-k]||{a:0}; week.push({d:d-k,a:r.a}); }
  const mx=Math.max(GOAL,...week.map(x=>x.a));
  const wd=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
  const pct=Math.min(100,seen.length/TARGET*100);
  const marks=[[500,"A1"],[1000,"A2"],[2000,"B1"],[3000,"B2"]];
  $("#statsBox").innerHTML=`
    <div class="tiles">
      <div class="tile"><div class="n" style="color:var(--mid)">🔥 ${curStreak()}</div><div class="l">дней подряд</div></div>
      <div class="tile"><div class="n" style="color:var(--ok)">${learned}</div><div class="l">выучено (повтор ≥ 7 дн.)</div></div>
      <div class="tile"><div class="n" style="color:var(--a2)">${learning}</div><div class="l">в процессе</div></div>
      <div class="tile"><div class="n" style="color:#c4b5fd">${acc}%</div><div class="l">точность ответов</div></div>
    </div>
    <div class="panel"><div class="h" style="margin-top:0"><span>Путь к 3000 слов</span><span>${seen.length} / ${TARGET}</span></div>
      <div class="road"><div class="fill" style="width:${Math.max(pct,1)}%"></div>
      ${marks.map(([n,l])=>`<div class="mk ${seen.length>=n?"got":""}" style="left:${n/TARGET*100}%">${l}<b>${n}</b></div>`).join("")}</div>
      <div class="note" style="text-align:left">В словаре ${W.length} слов и фраз уровней A1–B1 по ${TOPICS.length} темам.</div>
    </div>
    <div class="panel"><div class="h" style="margin-top:0"><span>Активность за неделю</span><span>цель ${GOAL}/день</span></div>
      <div class="bars">${week.map((x,k)=>`<div class="bar"><div class="c">${x.a||""}</div><div class="prism ${k===6?"today":""}" style="height:${Math.max(4,x.a/mx*100)}px"><div class="fr"></div><div class="sd"></div><div class="tp"></div></div><div class="d">${wd[new Date(x.d*86400000).getUTCDay()]}</div></div>`).join("")}</div>
    </div>
    <div class="panel"><div class="h" style="margin-top:0"><span>Темы</span></div>
      ${TOPICS.map((t,ti)=>{ const lvl=(W.find(w=>w[7]===ti)||[])[8]||""; const ids=W.map((_,i)=>i).filter(i=>W[i][7]===ti); const L=ids.filter(i=>S.cards[KEY[i]]&&S.cards[KEY[i]].seen&&S.cards[KEY[i]].s>=3).length; const P=ids.filter(i=>S.cards[KEY[i]]&&S.cards[KEY[i]].seen&&S.cards[KEY[i]].s<3).length; const n=ids.length;
        return `<div class="topic"><div class="r"><span style="color:var(--tx)"><b style="color:var(--a2);font-size:11px;margin-right:6px">${lvl}</b>${t}</span><span>${L+P} / ${n}</span></div><div class="tbar"><i style="width:${L/n*100}%;background:var(--ok)"></i><i style="width:${P/n*100}%;background:var(--a1)"></i></div></div>`; }).join("")}
      <div class="legend"><span><i style="background:var(--ok)"></i>выучено</span><span><i style="background:var(--a1)"></i>учу</span><span><i style="background:#0b0e1c;border:1px solid var(--line)"></i>не начато</span></div>
    </div>
    <div class="panel"><div class="h" style="margin-top:0"><span>Как работает повторение</span></div>
      <div class="note" style="text-align:left">Каждое слово повторяется через <b>1 → 3 → 7 → 14 → 30</b> дней. «Не знаю» сбрасывает слово на начало. В день: до <b>${NEW()}</b> новых, остальное — повторения, тест, аудирование и говорение. Цель — <b>${GOAL}</b> ответов в день.</div>
    </div>
    ${settingsHtml()}
    <button class="reset" id="resetBtn">Сбросить прогресс</button>`;
  bindSettings();
  let armed=false;
  $("#resetBtn").addEventListener("click",e=>{
    if(!armed){ armed=true; e.target.textContent="Точно сбросить? Нажмите ещё раз"; e.target.style.color="var(--bad)"; return; }
    S={cards:{},days:{},streak:0,lastDay:null,ts:0,set:S.set}; save(); buildQueue(); refreshAll(); toast("Прогресс сброшен");
  });
}

/* ===== DICTIONARY ===== */
let dq={q:"",t:-1,limit:60};
function stat(i){ const c=S.cards[KEY[i]]; if(!c||!c.seen) return ["не начато","#3a4370"]; if(c.s>=3) return ["выучено","var(--ok)"]; return ["учу","var(--a1)"]; }
function topicOptions(sel,allLabel){ return `<option value="-1"${sel<0?" selected":""}>${allLabel}</option>`+TOPICS.map((t,ti)=>{ const l=(W.find(w=>w[7]===ti)||[])[8]||""; return `<option value="${ti}"${sel===ti?" selected":""}>${l} · ${esc(t)}</option>`; }).join(""); }
function renderDict(){
  $("#dictBox").innerHTML=`
    <input class="search" id="dSearch" placeholder="Поиск: слово или перевод…" value="${esc(dq.q)}" autocomplete="off">
    <select class="sel" id="dTopic">${topicOptions(dq.t,"Все темы")}</select>
    <div class="h" style="margin-top:12px"><span id="dCount"></span><span></span></div>
    <div id="dList"></div>`;
  $("#dSearch").addEventListener("input",e=>{ dq.q=e.target.value; dq.limit=60; renderDictList(); });
  $("#dTopic").addEventListener("change",e=>{ dq.t=+e.target.value; dq.limit=60; renderDictList(); });
  renderDictList();
}
function renderDictList(){
  stopCardMic();
  const q=dq.q.trim().toLowerCase();
  const ids=W.map((_,i)=>i).filter(i=>(dq.t<0||W[i][7]===dq.t)&&(!q||W[i][0].toLowerCase().includes(q)||W[i][2].toLowerCase().includes(q)));
  $("#dCount").textContent="Найдено: "+ids.length;
  $("#dList").innerHTML=ids.slice(0,dq.limit).map(i=>{ const w=W[i], [st,col]=stat(i); return `
    <div class="row" data-i="${i}">
      <div class="rw"><div><b>${esc(w[0])}</b> <span class="ipa" style="font-size:12px">${esc(w[1])}</span></div>
        <div class="ru2">${esc(w[2])}</div>
        <div class="ex">${esc(w[5])}<br><span>${esc(w[6])}</span></div>
        <div class="ex"><span>📍 ${esc(w[4])} · ${esc(w[3])}</span></div><div class="cres" data-res="${i}"></div></div>
      <div class="rs"><i class="dot" style="background:${col}" title="${st}"></i><button class="spk sm" data-say="${esc(w[0])}" title="Прослушать">${SPK}</button><button class="spk sm mic2" data-mic="${i}" title="Произнести">${MIC}</button></div>
    </div>`; }).join("")+(ids.length>dq.limit?`<button class="next on" id="dMore" style="background:var(--card2);color:var(--tx);border:1px solid var(--line)">Показать ещё (${ids.length-dq.limit})</button>`:"");
  $("#dList").querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); say(b.dataset.say,b); }));
  $("#dList").querySelectorAll(".row").forEach(r=>r.addEventListener("click",e=>{ if(e.target.closest(".cres")) return; r.classList.toggle("open"); }));
  $("#dList").querySelectorAll("[data-mic]").forEach(b=>{ const i=+b.dataset.mic; attachRepeat(b,$(`#dList [data-res="${i}"]`),W[i][0]); });
  const m=$("#dMore"); if(m) m.addEventListener("click",()=>{ dq.limit+=100; renderDictList(); });
}

/* ===== SETTINGS & BACKUP ===== */
function settingsHtml(){
  const ns=[10,15,20,25,30,40,50], rs=[[0.8,"Медленно"],[0.95,"Обычно"],[1.1,"Быстро"]];
  return `<div class="panel"><div class="h" style="margin-top:0"><span>Настройки</span></div>
    <label class="lab">Новых слов в день</label>
    <select class="sel" id="sNew">${ns.map(n=>`<option value="${n}"${S.set.n===n?" selected":""}>${n}</option>`).join("")}</select>
    <label class="lab">Откуда брать новые слова</label>
    <select class="sel" id="sTopic">${topicOptions(S.set.topic,"Все темы по порядку (A1 → B1)")}</select>
    <label class="lab">Скорость озвучки</label>
    <select class="sel" id="sRate">${rs.map(([v,l])=>`<option value="${v}"${S.set.rate===v?" selected":""}>${l}</option>`).join("")}</select>
    <div class="h" style="margin-top:16px"><span>Резервная копия</span></div>
    <div class="btns"><button class="g" id="bExp">⬇️ Экспорт</button><button class="g" id="bImp">⬆️ Импорт</button></div>
    <div id="impBox" style="display:none;margin-top:10px">
      <textarea class="search" id="impText" rows="4" placeholder="Вставьте сюда JSON с прогрессом…"></textarea>
      <input type="file" id="impFile" accept=".json,application/json" style="margin:8px 0;color:var(--mut);font-size:13px">
      <button class="next on" id="impGo">Загрузить прогресс</button>
    </div>
    <div class="note" style="text-align:left;margin-top:8px">Прогресс хранится в этом браузере${dbRef?" и в вашем аккаунте Claude":""}. Экспорт копирует его в буфер обмена (и скачивает файл, где это разрешено).</div>
  </div>`;
}
function bindSettings(){
  $("#sNew").addEventListener("change",e=>{ S.set.n=+e.target.value; save(); buildQueue(); refreshHeader(); toast("Новых в день: "+S.set.n); });
  $("#sTopic").addEventListener("change",e=>{ S.set.topic=+e.target.value; save(); buildQueue(); toast("Тема новых слов сохранена"); });
  $("#sRate").addEventListener("change",e=>{ S.set.rate=+e.target.value; save(); say("This is how fast I speak."); });
  $("#bExp").addEventListener("click",async()=>{
    const json=JSON.stringify(S);
    try{ await navigator.clipboard.writeText(json); toast("Прогресс скопирован в буфер 📋"); }catch(e){ toast("Не удалось скопировать"); }
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([json],{type:"application/json"})); a.download="speakup3d-progress-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
  });
  $("#bImp").addEventListener("click",()=>{ const b=$("#impBox"); b.style.display=b.style.display==="none"?"block":"none"; });
  $("#impFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ $("#impText").value=t; }); });
  $("#impGo").addEventListener("click",()=>{
    try{ const d=JSON.parse($("#impText").value); if(!d||typeof d.cards!=="object") throw 0;
      S=Object.assign({cards:{},days:{},streak:0,lastDay:null},d); S.set=Object.assign({},DEF_SET,S.set||{}); save(); buildQueue(); refreshAll(); toast("Прогресс загружен ✅");
    }catch(e){ toast("Неверный формат файла"); }
  });
}

/* ===== NAV ===== */
let cur="learn";
const R={learn:renderLearn,quiz:renderQuiz,listen:renderListen,speak:renderSpeak,dict:renderDict,stats:renderStats};
function go(v){
  stopCardMic();
  cur=v; document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  try{ if(TTS) TTS.stop(); else speechSynthesis.cancel(); }catch(e){}
  if(v==="learn"&&qi>=queue.length) buildQueue();
  R[v](); window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.v)));
function refreshAll(){ refreshHeader(); if(cur==="learn") buildQueue(); R[cur](); }
buildQueue(); refreshHeader(); renderLearn();
</script>
